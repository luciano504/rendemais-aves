name: Sync Aves (VR -> App)

on:
  schedule:
    - cron: "23 8 * * *"   # 05h23 Recife (minuto quebrado: fila menos concorrida)
    - cron: "47 9 * * *"   # 06h47 Recife (reforço; o sync é idempotente)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-aves.yml"
      - "scripts/sync_aves.py"

concurrency:
  group: aves
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests pandas

      - name: Sync Aves
        env:
          VR_URL: ${{ secrets.VR_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/sync_aves.py
