name: Sondar operadoras (VR)

# Diagnóstico temporário para o Vendas Premiadas: descobre onde o VR grava a
# operadora de caixa de cada cupom. Mostra só nomes de colunas e contagens
# (este repo é público — nenhum nome de pessoa vai para o resumo).
on:
  workflow_dispatch: {}

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Sondar
        env:
          VR_URL: ${{ secrets.VR_URL }}
        run: |
          cat > s.py <<'PY'
          import os, io, requests, pandas as pd
          from urllib.parse import urlencode
          U=os.environ["VR_URL"]; out=[]
          def q(sql):
              r=requests.post(U,data=urlencode({"sql_query":sql,"export_type":"csv"}),headers={"Content-Type":"application/x-www-form-urlencoded"},timeout=300)
              t=r.text.lstrip("﻿").lstrip()
              if t[:1]=="<" or "fatal error" in t[:200].lower(): return "ERRO: "+t[:150].replace("\n"," ")
              return pd.read_csv(io.StringIO(t))
          def bloco(tit,sql):
              d=q(sql); out.append(f"### {tit}\n")
              out.append(d if isinstance(d,str) else "```\n"+d.to_string(index=False)[:6000]+"\n```")
              out.append("\n")
          bloco("Cobertura: vendas de 105,106,371,3421,3420,3422 em nov/26 por loja","""
            select v.id_loja, count(distinct v.id) cupons,
                   count(distinct v.id) filter (where o.id is not null) cupons_com_operadora,
                   count(distinct v.matricula) matriculas, count(distinct o.id) operadoras_achadas,
                   count(distinct v.id) filter (where v.matricula is null or v.matricula=0) sem_matricula
            from pdv.venda v join pdv.vendaitem vi on vi.id_venda=v.id
            left join pdv.operador o on o.matricula=v.matricula and o.id_loja=v.id_loja
            where vi.id_produto in (105,106,371,3421,3420,3422) and v.data>='2026-11-01'
              and not v.cancelado and not vi.cancelado
            group by 1 order by 1""")
          bloco("Matrícula repetida em mais de uma loja (operadora que trabalha em 2 lojas?)","""
            select count(*) matriculas_em_varias_lojas from (select matricula from pdv.operador where id_situacaocadastro=1 group by matricula having count(distinct id_loja)>1) x""")
          bloco("Operadoras ativas por loja","select id_loja, count(*) ativas, count(*) filter (where id_tiponiveloperador is not null) com_nivel from pdv.operador where id_situacaocadastro=1 group by 1 order by 1")
          bloco("Níveis de operador","select id, descricao from pdv.tiponiveloperador order by 1")
          open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("\n".join(str(x) for x in out))
          PY
          python s.py
