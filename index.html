<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>Aves Resfriadas — Rende Mais</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#1F3864; --navy2:#2a4a80; --amber:#FFBF00; --bg:#f4f6fa; --card:#ffffff;
  --tx:#1c2333; --mut:#6b7688; --ok:#1e8e3e; --warn:#e37400; --bad:#c5221f; --bd:#e3e8f0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12161f; --card:#1b2230; --tx:#e8ecf4; --mut:#96a0b5; --bd:#2a3347; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--tx); font-size:15px}
header{background:var(--navy); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:10px}
header h1{font-size:17px; margin:0; flex:1; font-weight:700}
header .sub{font-size:12px; opacity:.8}
.badge{background:var(--amber); color:#1F3864; font-weight:700; border-radius:20px; padding:3px 10px; font-size:12px}
main{max-width:980px; margin:0 auto; padding:14px 12px 90px}
.card{background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:14px; margin-bottom:12px}
.tabs{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto}
.tab{border:1px solid var(--bd); background:var(--card); color:var(--tx); border-radius:20px;
  padding:8px 16px; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap}
.tab.on{background:var(--navy); color:#fff; border-color:var(--navy)}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
.chip{border:1px solid var(--bd); background:var(--card); border-radius:16px; padding:5px 12px;
  font-size:13px; font-weight:600; cursor:pointer; color:var(--tx)}
.chip.on{background:var(--amber); border-color:var(--amber); color:#1F3864}
h2{font-size:15px; margin:18px 0 8px; color:var(--mut); text-transform:uppercase; letter-spacing:.4px}
.item{background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:12px; margin-bottom:10px}
.item .nome{font-weight:700; font-size:14px; margin-bottom:2px}
.item .forn{font-size:11px; font-weight:700; border-radius:4px; padding:1px 6px; margin-left:6px}
.forn.natto{background:#e8f0fe; color:#1a56b8}
.forn.mauricea{background:#fde8e8; color:#b81a1a}
@media (prefers-color-scheme: dark){ .forn.natto{background:#1a2f52} .forn.mauricea{background:#4a1f1f} }
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0}
.g{background:var(--bg); border-radius:8px; padding:6px 8px; text-align:center}
.g .v{font-weight:700; font-size:15px}
.g .l{font-size:10px; color:var(--mut); text-transform:uppercase}
/* ---- mercadoria em trânsito: o aviso que evita o pedido dobrado ---- */
.item.tem-transito{border-color:#c5221f; border-width:2px; box-shadow:0 0 0 3px rgba(197,34,31,.08)}
.selo-tr{display:inline-block; background:#c5221f; color:#fff; font-size:10px; font-weight:700;
 border-radius:10px; padding:2px 8px; margin-left:6px; white-space:nowrap}
.selo-tr.velho{background:#985200}
.transito{background:#fdeceb; border-left:4px solid #c5221f; border-radius:8px;
 padding:8px 10px; margin:8px 0 4px; font-size:12px; line-height:1.45; color:#4a1512}
.transito.velho{background:#fff3e0; border-left-color:#e37400; color:#4a2c00}
.transito b{color:#a50e0b} .transito.velho b{color:#985200}
.transito .nf{display:inline-block; background:#fff; border:1px solid rgba(0,0,0,.12);
 border-radius:6px; padding:1px 7px; font-weight:700; margin-right:6px}
.sug{display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap}
.sug .sis{background:var(--navy); color:#fff; border-radius:10px; padding:8px 12px; font-weight:700; font-size:15px}
.sug .sis small{font-weight:400; opacity:.75; display:block; font-size:10px}
input[type=number], input[type=password], input[type=text], select, textarea{
  border:1.5px solid var(--bd); border-radius:10px; padding:10px; font-size:16px;
  background:var(--card); color:var(--tx); width:100%}
.sug input[type=number]{width:90px; text-align:center; font-weight:700}
textarea{margin-top:8px; min-height:54px}
button{border:0; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer}
.bt-p{background:var(--amber); color:#1F3864}
.bt-s{background:var(--navy); color:#fff}
.bt-g{background:var(--bg); color:var(--tx); border:1px solid var(--bd)}
.footer-bar{position:fixed; bottom:0; left:0; right:0; background:var(--card);
  border-top:1px solid var(--bd); padding:10px 14px; display:flex; gap:10px; justify-content:center; z-index:10}
.footer-bar button{flex:1; max-width:420px}
.muted{color:var(--mut); font-size:13px}
.alert{border-left:4px solid var(--warn); background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13px}
.pos{color:var(--ok)} .neg{color:var(--bad)}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:7px 6px; border-bottom:1px solid var(--bd); text-align:right}
th:first-child, td:first-child{text-align:left}
th{color:var(--mut); font-size:11px; text-transform:uppercase}
.just{font-size:12px; background:var(--bg); border-radius:8px; padding:6px 8px; margin-top:4px; color:var(--mut)}
.login-box{max-width:360px; margin:60px auto; text-align:center}
.login-box img,.login-logo{width:74px;height:74px;margin-bottom:10px}
.center{text-align:center}
.hide{display:none}
.tblwrap{overflow-x:auto}
/* ---- identidade da loja (evita lançar na loja errada) ---- */
.faixa-loja{color:#fff; border-radius:14px; padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.15)}
.faixa-loja .cod{background:rgba(255,255,255,.22); border-radius:10px; padding:6px 10px; font-weight:800; font-size:20px}
.faixa-loja .nm{font-weight:800; font-size:20px; line-height:1.1; text-transform:uppercase}
.faixa-loja .br{font-size:13px; opacity:.92}
.chip-loja{border:2px solid var(--bd); background:var(--card); border-radius:12px; padding:6px 10px; cursor:pointer;
  color:var(--tx); text-align:left; line-height:1.15; min-width:104px}
.chip-loja b{font-size:13px; display:block}
.chip-loja small{font-size:11px; color:var(--mut)}
.chip-loja.on{color:#fff} .chip-loja.on small{color:#fff; opacity:.9}
.modal-fundo{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px}
.modal{background:var(--card); color:var(--tx); border-radius:16px; max-width:440px; width:100%; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.35)}
.modal .topo{color:#fff; padding:16px; text-align:center}
.modal .topo .grande{font-size:24px; font-weight:800; text-transform:uppercase; line-height:1.1}
.modal .corpo{padding:14px 16px; font-size:14px; max-height:50vh; overflow:auto}
.modal .acoes{display:flex; gap:10px; padding:0 16px 16px}
.modal .acoes button{flex:1}
.fora{background:#fdeceb; border-left:4px solid var(--bad); border-radius:8px; padding:8px 10px; margin:8px 0; color:#4a1512; font-size:13px}
.fora li{margin:2px 0}
.alerta-vermelho{background:var(--bad); color:#fff; border-radius:8px; padding:8px 10px; margin-bottom:8px; font-weight:700}
.lanc{font-size:12px; margin-top:6px}
.lanc button{padding:5px 10px; font-size:12px; border-radius:8px; margin-left:6px}
.bt-sync{background:#0b8043; color:#fff; border-radius:20px; padding:8px 16px; font-size:14px; white-space:nowrap}
.sync-status{border-left:4px solid #0b8043; background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13px}
.sync-status.erro{border-left-color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>🐔 Aves Resfriadas <span class="sub" id="hSub"></span></h1>
  <span class="badge" id="hUser"></span>
  <button class="bt-g" style="padding:6px 10px" onclick="sair()">Sair</button>
</header>
<main id="app"></main>
<div class="footer-bar hide" id="fbar"></div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://estciwkeihmokvlnvaum.supabase.co";
const SUPABASE_KEY = "sb_publishable_l14fjxQmWUeu5OXlZJ35GA_-X3ESkgZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LOJA_INFO = {   // nome + bairro + cor fixa de cada loja (para ninguém lançar na loja errada)
  L01:{nome:"Veneza",     bairro:"Jardim São Paulo", cor:"#1565C0"},
  L02:{nome:"Máximo",     bairro:"Vasco da Gama",    cor:"#2E7D32"},
  L03:{nome:"Royal",      bairro:"Brasília Teimosa", cor:"#6A1B9A"},
  L05:{nome:"Alvorada",   bairro:"Iputinga",         cor:"#C62828"},
  L08:{nome:"Tradição",   bairro:"Paulista",         cor:"#E65100"},
  L09:{nome:"Massangana", bairro:"Piedade",          cor:"#00838F"}};
const LOJAS = Object.fromEntries(Object.entries(LOJA_INFO).map(([k,v])=>[k,`${k} ${v.nome}`]));
const GH_REPO = "luciano504/rendemais-aves", GH_WF = "sync-aves.yml";
const FATOR_FORA = 3;   // trava 4: pede conferência se o pedido passar de 3x o normal da loja
const PAPEIS_COMPRADOR = ["gestor","comprador","prevencao"];
const DOW_NOMES = ["dom","seg","ter","qua","qui","sex","sáb"];

let sess=null, tela="pedido", lojaSel=null, lojaTrocadaEm=0, cache={}, syncMsg=null;

/* ================= UTIL ================= */
const $ = s=>document.querySelector(s);
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function hojeRecife(){ // data corrente no fuso de Recife
  return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Recife"}).format(new Date());}
function dISO(d){return d.toISOString().slice(0,10);}
function fmt(n,dec){ if(n===null||n===undefined) return "—";
  return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:dec??0,maximumFractionDigits:dec??1});}
function unidade(it){return it.tipo==="granel"?"kg":it.tipo==="galeto"?"un":"bdj";}
function unidadePedido(it){return "cx";}   // fornecedor só fatura caixa fechada
// quantas unidades de venda (kg/un/bdj) cabem numa caixa mãe
function porCaixa(it){return Number(it.unidades_caixa)||1;}

/* ---- MERCADORIA EM TRÂNSITO ----
   O fornecedor já emitiu a NF-e e ela ainda não deu entrada na loja.
   Serve para a loja NÃO pedir de novo e receber dobrado.            */
function temTransito(s){return s && Number(s.transito_cx)>0;}
function selo(s){
  if(!temTransito(s)) return "";
  const d=s.transito_dias;
  return `<span class="selo-tr ${d>=3?"velho":""}">🚚 ${fmt(s.transito_cx,1)} cx a caminho</span>`;
}
function avisoTransito(it,s){
  if(!temTransito(s)) return "";
  const d = s.transito_dias, u = unidade(it);
  const velho = d>=3;
  return `<div class="transito ${velho?"velho":""}">
    <b>🚚 JÁ FATURADO — NÃO PEÇA DE NOVO.</b>
    O fornecedor emitiu <b>${fmt(s.transito_cx,1)} cx</b> (${fmt(s.transito_qtd,1)} ${u})
    que ainda não deram entrada nesta loja.<br>
    <span class="nf">NF ${esc(s.transito_nf||"")}</span>
    ${velho
      ? `<b class="alerta-velho">Emitida há ${d} dias.</b> Para resfriado isso é muito tempo:
         confirme com o fornecedor se está mesmo a caminho, se já chegou sem ser lançada,
         ou se a nota foi cancelada — só então peça de novo.`
      : `Considerando o que vem, o pedido de hoje seria
         <b>${fmt(s.sug_liquida)} cx</b> em vez de ${fmt(s.sug_sistema)} cx.`}
  </div>`;
}
// texto do equivalente: "3 cx = 60 kg"
function equiv(it,cx){
  if(cx===""||cx===null||cx===undefined) return "";
  const n=Number(cx); if(!n) return "";
  return `= ${fmt(n*porCaixa(it),1)} ${unidade(it)}`;
}
function dataBR(iso){const [a,m,d]=iso.split("-");return `${d}/${m}`;}
function corLoja(l){return (LOJA_INFO[l]||{}).cor||"#1F3864";}
function nomeLoja(l){const i=LOJA_INFO[l]; return i?`${l} ${i.nome}`:l;}
function nomeLojaLongo(l){const i=LOJA_INFO[l]; return i?`${l} · ${i.nome} · ${i.bairro}`:l;}
function faixaLoja(l,txt){const i=LOJA_INFO[l]||{nome:l,bairro:""};
  return `<div class="faixa-loja" style="background:${corLoja(l)}">
    <span class="cod">${l}</span>
    <div><div class="br">${txt||"Você está lançando para a loja"}</div>
      <div class="nm">${esc(i.nome)}</div><div class="br">📍 ${esc(i.bairro)}</div></div></div>`;}
/* janela de confirmação grande, na cor da loja. Retorna Promise<boolean> */
function confirmar({loja,titulo,grande,corpo,ok="Confirmar",nao="Voltar",exigeCheck=null}){
  return new Promise(res=>{
    const d=document.createElement("div"); d.className="modal-fundo";
    d.innerHTML=`<div class="modal">
      <div class="topo" style="background:${corLoja(loja)}"><div>${titulo||""}</div>
        <div class="grande">${grande||""}</div></div>
      <div class="corpo">${corpo||""}
        ${exigeCheck?`<label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-weight:700">
          <input type="checkbox" id="mdChk" style="width:22px;height:22px;flex:none"> ${exigeCheck}</label>`:""}</div>
      <div class="acoes"><button class="bt-g" id="mdNao">${nao}</button>
        <button id="mdOk" style="background:${corLoja(loja)};color:#fff">${ok}</button></div></div>`;
    document.body.appendChild(d);
    const okB=d.querySelector("#mdOk"), chk=d.querySelector("#mdChk");
    if(chk){okB.disabled=true; okB.style.opacity=.4; chk.onchange=()=>{okB.disabled=!chk.checked; okB.style.opacity=chk.checked?1:.4;};}
    d.querySelector("#mdNao").onclick=()=>{d.remove();res(false);};
    okB.onclick=()=>{if(okB.disabled)return; d.remove();res(true);};
  });
}
/* trava 4: quantidade muito acima do normal DAQUELA loja */
function refNormal(loja,it){
  const s=sugDe(loja,it.id_produto)||{};
  const prevCx=((Number(s.prev_d1)||0)+(Number(s.prev_d2)||0))/porCaixa(it);
  return Math.max(Number(s.sug_sistema)||0, Math.ceil(prevCx), 1);
}
function foraDoNormal(loja,it,val){const r=refNormal(loja,it); return val>=3 && val>FATOR_FORA*r ? r : 0;}
function listaFora(fora){
  if(!fora.length) return "";
  return `<div class="fora"><b>⚠️ ${fora.length} item(ns) muito acima do normal desta loja:</b><ul style="margin:6px 0 0 18px;padding:0">
    ${fora.map(f=>`<li><b>${esc(f.nome)}</b>: ${f.val} cx (o normal aqui é até ~${f.ref} cx)</li>`).join("")}</ul>
    Será que este número não é de outra loja?</div>`;
}
function hhmm(iso){return iso?new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Recife"}):"";}
function esc(t){return String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}

/* ================= LOGIN ================= */
async function telaLogin(){
  $("#hUser").textContent=""; $("#hSub").textContent="";
  const {data,error} = await sb.from("usuarios").select("id,nome,papel,loja")
     .eq("ativo",true).neq("papel","fornecedor").order("nome");
  if(error){ $("#app").innerHTML=`<div class="alert">Erro ao conectar: ${esc(error.message)}</div>`; return;}
  $("#app").innerHTML = `
  <div class="login-box card">
    <div style="font-size:46px">🐔</div>
    <h2 style="text-transform:none;font-size:18px;color:var(--tx)">Pedido de Aves Resfriadas</h2>
    <p class="muted">Sugestão diária de pedido — Natto e Mauricea</p>
    <select id="lgUser"><option value="">— escolha o seu nome —</option>
      ${Object.keys(LOJA_INFO).map(l=>{const us=data.filter(u=>u.loja===l&&!PAPEIS_COMPRADOR.includes(u.papel));
        return us.length?`<optgroup label="${esc(nomeLojaLongo(l))}">${us.map(u=>`<option value="${u.id}">${esc(u.nome)} — ${esc(nomeLoja(l))}</option>`).join("")}</optgroup>`:"";}).join("")}
      ${(()=>{const us=data.filter(u=>PAPEIS_COMPRADOR.includes(u.papel)||!LOJA_INFO[u.loja]);
        return us.length?`<optgroup label="Comprador / Gestor">${us.map(u=>`<option value="${u.id}">${esc(u.nome)}</option>`).join("")}</optgroup>`:"";})()}
    </select>
    <input type="password" id="lgPin" placeholder="PIN" inputmode="numeric" style="margin-top:8px">
    <button class="bt-p" style="width:100%;margin-top:12px" onclick="doLogin()">Entrar</button>
  </div>`;
}
async function doLogin(){
  const id=$("#lgUser").value, pin=$("#lgPin").value;
  if(!id) return alert("Escolha o seu nome na lista.");
  const {data,error} = await sb.from("usuarios").select("*").eq("id",id).single();
  if(error) return alert("Erro: "+error.message);
  if(data.pin_hash !== await sha256(pin)) return alert("PIN incorreto.");
  sess=data; localStorage.setItem("aves_sess",JSON.stringify({id:data.id}));
  iniciar();
}
function sair(){localStorage.removeItem("aves_sess"); sess=null; lojaSel=null; telaLogin();}
/* operador confirma a loja no 1º acesso de cada dia */
async function confirmaLojaDoDia(){
  if(PAPEIS_COMPRADOR.includes(sess.papel)) return true;
  const chave="aves_loja_ok_"+sess.id, hoje=hojeRecife();
  try{ if(localStorage.getItem(chave)===hoje) return true; }catch(e){}
  const i=LOJA_INFO[sess.loja]||{nome:sess.loja,bairro:""};
  const ok=await confirmar({loja:sess.loja, titulo:`Olá, ${esc(sess.nome.split(" ")[0])}! Você está na loja`,
    grande:`${sess.loja} · ${esc(i.nome)}`,
    corpo:`<p style="font-size:16px;text-align:center;margin:4px 0">📍 <b>${esc(i.bairro)}</b></p>
      <p class="muted" style="text-align:center">Tudo o que você lançar vai para esta loja.</p>`,
    ok:`Sim, sou da ${esc(i.nome)}`, nao:"Não, sou de outra loja"});
  if(!ok){ alert("Você entrou com o usuário de outra loja.\nSaia e entre com o SEU nome. Se o seu nome não estiver na lista, fale com o comprador."); sair(); return false; }
  try{ localStorage.setItem(chave,hoje); }catch(e){}
  return true;
}

/* ================= DADOS ================= */
async function carregar(){
  const hoje = hojeRecife();
  const d1 = new Date(hoje+"T12:00:00"); d1.setDate(d1.getDate()-1);
  const d2 = new Date(hoje+"T12:00:00"); d2.setDate(d2.getDate()-2);
  const [it, sg, di] = await Promise.all([
    sb.from("aves_itens").select("*").eq("ativo",true).order("ordem"),
    sb.from("aves_sugestoes").select("*").eq("data",hoje),
    sb.from("aves_diario").select("data,loja,id_produto,venda,estoque_virtual").in("data",[dISO(d1),dISO(d2)])
  ]);
  for(const r of [it,sg,di]) if(r.error) throw r.error;
  cache.itens = it.data; cache.porId = Object.fromEntries(it.data.map(i=>[i.id_produto,i]));
  cache.sug = sg.data; cache.hoje = hoje; cache.dataBase = null;
  // Sync de hoje não rodou? Usa o estoque/sugestão da ÚLTIMA atualização (pedido 17/09)
  if(!sg.data.some(s=>s.sug_sistema!==null&&s.sug_sistema!==undefined)){
    const ul = await sb.from("aves_sugestoes").select("data").not("sug_sistema","is",null)
      .lt("data",hoje).order("data",{ascending:false}).limit(1);
    if(!ul.error && ul.data.length){
      const dBase = ul.data[0].data;
      const bs = await sb.from("aves_sugestoes").select("*").eq("data",dBase);
      if(!bs.error && bs.data.length){
        cache.dataBase = dBase;
        const hj = Object.fromEntries(sg.data.map(s=>[s.loja+"|"+s.id_produto,s]));
        const limpo = {sug_operador:null,justificativa_operador:null,operador_login:null,operador_em:null,
                       pedido_final:null,comprador_login:null,comprador_em:null};
        const junt = bs.data.map(b=>{
          const t = hj[b.loja+"|"+b.id_produto]||{}; delete hj[b.loja+"|"+b.id_produto];
          const o = {...b, ...limpo, data:hoje};
          for(const c of Object.keys(limpo)) if(t[c]!==null&&t[c]!==undefined) o[c]=t[c];
          return o;});
        cache.sug = junt.concat(Object.values(hj));
      }
    }
  }
  if(PAPEIS_COMPRADOR.includes(sess.papel)){
    const us=await sb.from("usuarios").select("id,nome,loja");
    cache.users=us.error?{}:Object.fromEntries(us.data.map(u=>[u.id,u]));
  }
  cache.vendas = {};   // (loja|pid) -> {d1,d2}
  for(const r of di.data){
    const k=r.loja+"|"+r.id_produto;
    cache.vendas[k] = cache.vendas[k]||{};
    if(r.data===dISO(d1)) cache.vendas[k].d1=r.venda;
    if(r.data===dISO(d2)) cache.vendas[k].d2=r.venda;
  }
}

  const diaAtras=k=>{const d=new Date(hoje); d.setDate(d.getDate()-k); return dISO(d);};

      <td>${fmt(tot/28,1)}</td>

/* ================= SINCRONIZAR AGORA (comprador) =================
   O token do GitHub fica no Supabase CIFRADO com a senha (AES-GCM, chave PBKDF2).
   A senha não está escrita em lugar nenhum do código: quem não sabe a senha
   não consegue abrir o token. O token só tem permissão de disparar o sync deste app. */
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function chaveDe(senha,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function cifrar(texto,senha){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await chaveDe(senha,salt),new TextEncoder().encode(texto));
  return JSON.stringify({s:b64(salt),i:b64(iv),c:b64(c)});
}
async function decifrar(json,senha){
  const o=JSON.parse(json);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.i)},await chaveDe(senha,unb64(o.s)),unb64(o.c));
  return new TextDecoder().decode(p);
}
function pedirTexto({titulo,grande,corpo,placeholder,tipo="password",ok="Continuar"}){
  return new Promise(res=>{
    const d=document.createElement("div"); d.className="modal-fundo";
    d.innerHTML=`<div class="modal"><div class="topo" style="background:#0b8043"><div>${titulo||""}</div><div class="grande">${grande||""}</div></div>
      <div class="corpo">${corpo||""}<input type="${tipo}" id="mdTx" placeholder="${placeholder||""}" autocomplete="off" style="margin-top:8px"></div>
      <div class="acoes"><button class="bt-g" id="mdNao">Cancelar</button><button id="mdOk" style="background:#0b8043;color:#fff">${ok}</button></div></div>`;
    document.body.appendChild(d);
    const tx=d.querySelector("#mdTx"); setTimeout(()=>tx.focus(),50);
    const fim=v=>{d.remove();res(v);};
    d.querySelector("#mdNao").onclick=()=>fim(null);
    d.querySelector("#mdOk").onclick=()=>fim(tx.value.trim()||null);
    tx.onkeydown=e=>{if(e.key==="Enter") fim(tx.value.trim()||null);};
  });
}
async function lerCfg(){
  const r=await sb.from("aves_config").select("valor").eq("chave","gh_token_cifrado").limit(1);
  if(r.error) throw new Error("Tabela aves_config não encontrada no Supabase — rode o aves_config.sql uma vez.");
  return r.data.length?r.data[0].valor:null;
}
async function gravarCfg(v){
  const r=await sb.from("aves_config").upsert([{chave:"gh_token_cifrado",valor:v,atualizado_em:new Date().toISOString()}],{onConflict:"chave"});
  if(r.error) throw r.error;
}
async function configurarToken(senha){
  const tok=await pedirTexto({titulo:"Primeira vez: configurar", grande:"Chave do GitHub",
    corpo:`<p>Cole o token do GitHub (começa com <b>github_pat_</b>, permissão <b>Actions: Read and write</b> no repositório rendemais-aves).</p>
      <p class="muted">Ele será guardado cifrado com a senha que você acabou de digitar. Só é pedido uma vez.</p>`,
    placeholder:"github_pat_...", ok:"Guardar"});
  if(!tok) return null;
  if(!/^(github_pat_|ghp_)/.test(tok)){ alert("Isso não parece um token do GitHub (deve começar com github_pat_)."); return null; }
  await gravarCfg(await cifrar(tok,senha));
  return tok;
}
function gh(tok,caminho,opt={}){
  return fetch(`https://api.github.com/repos/${GH_REPO}${caminho}`,{...opt,
    headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});
}
function statusSync(txt,erro){ syncMsg={txt,erro}; const el=$("#syncSt");
  if(el){ el.className="sync-status"+(erro?" erro":""); el.innerHTML=txt; } }
async function sincronizarAgora(){
  if(syncMsg&&syncMsg.rodando) return alert("Já existe uma sincronização em andamento.");
  const senha=await pedirTexto({titulo:"Sincronizar com o VR agora", grande:"Senha do comprador",
    corpo:`<p>Busca no VR o estoque, as vendas e as notas em trânsito e recalcula a sugestão de todas as lojas. Leva de 1 a 3 minutos.</p>`,
    placeholder:"senha", ok:"Sincronizar"});
  if(!senha) return;
  let tok;
  try{
    const cfg=await lerCfg();
    if(!cfg){ tok=await configurarToken(senha); if(!tok) return; }
    else { try{ tok=await decifrar(cfg,senha); }catch(e){ return alert("❌ Senha incorreta."); } }
  }catch(e){ return alert("Erro: "+e.message); }
  const t0=Date.now();
  syncMsg={rodando:true}; render();
  statusSync("🔄 Disparando a sincronização no GitHub…");
  let r;
  try{ r=await gh(tok,`/actions/workflows/${GH_WF}/dispatches`,{method:"POST",body:JSON.stringify({ref:"main"})}); }
  catch(e){ syncMsg=null; return statusSync("❌ Sem conexão com o GitHub: "+esc(e.message),true); }
  if(r.status===401||r.status===403||r.status===404){
    syncMsg=null; statusSync(`❌ O GitHub recusou a chave (erro ${r.status}). Ela pode ter vencido ou estar sem permissão.`,true);
    if(confirm("A chave do GitHub foi recusada. Quer cadastrar uma chave nova agora?")){
      try{ if(await configurarToken(senha)) alert("Chave nova guardada. Toque em Sincronizar de novo."); }catch(e){ alert("Erro: "+e.message); }
    }
    return;
  }
  if(r.status!==204){ syncMsg=null; return statusSync(`❌ Resposta inesperada do GitHub (${r.status}).`,true); }
  syncMsg.rodando=true;
  statusSync("⏳ Sincronização na fila do GitHub… (não precisa ficar na tela)");
  let run=null;
  for(let k=0;k<72;k++){                        // até 6 minutos
    await new Promise(z=>setTimeout(z,5000));
    try{
      const lr=await (await gh(tok,`/actions/workflows/${GH_WF}/runs?event=workflow_dispatch&per_page=5`)).json();
      run=(lr.workflow_runs||[]).find(x=>new Date(x.created_at).getTime()>=t0-60000)||run;
    }catch(e){}
    if(!run) continue;
    const seg=Math.round((Date.now()-t0)/1000);
    if(run.status!=="completed"){ statusSync(`⏳ Sincronizando (run #${run.run_number}, ${run.status==="queued"?"na fila":"rodando"})… ${seg}s`); syncMsg.rodando=true; continue; }
    syncMsg=null;
    if(run.conclusion==="success"){
      statusSync(`✅ Sincronizado às ${hhmm(new Date().toISOString())} (run #${run.run_number}). Dados recarregados.`);
      await carregar(); render(); statusSync(syncMsg?.txt||`✅ Sincronizado às ${hhmm(new Date().toISOString())} (run #${run.run_number}). Dados recarregados.`);
    } else statusSync(`❌ A sincronização terminou com erro (run #${run.run_number}: ${esc(run.conclusion)}). Veja em GitHub → Actions.`,true);
    return;
  }
  syncMsg=null;
  statusSync("⚠️ O GitHub ainda não terminou depois de 6 minutos. Recarregue a página daqui a pouco.",true);
}

    h+=`<tr>
      <td><span class="forn ${it.fornecedor}" style="margin-left:0">${it.fornecedor==="natto"?"N":"M"}</span>
          ${esc(it.descricao.replace(/NATTO|MAURICEA/g,"").replace(/\s+/g," "))}
          ${s.justificativa_operador?`<div class="just">💬 ${esc(s.justificativa_operador)}</div>`:""}</td>
      <td>${fmt(s.estoque_virtual)}</td>
      <td>${fmt((s.prev_d1||0)+(s.prev_d2||0))}</td>
      <td>${temTransito(s)?`<span class="selo-tr ${s.transito_dias>=3?"velho":""}" title="NF ${esc(s.transito_nf||"")}">${fmt(s.transito_cx,1)}</span>`:"—"}</td>
      <td><b>${fmt(s.sug_sistema)}</b>${temTransito(s)?`<div class="muted" style="font-size:10px">c/ trânsito: <b>${fmt(s.sug_liquida)}</b></div>`:""}</td>
      <td>${s.sug_operador===null||s.sug_operador===undefined?"—":`<b class="${difere(s)?"neg":"pos"}">${fmt(s.sug_operador)}</b>`}</td>
      <td><input type="number" min="0" step="1" style="width:58px;padding:6px" id="pd${it.id_produto}"
          value="${s.pedido_final??""}" placeholder="${fmt(s.sug_operador??s.sug_sistema)}"
          oninput="eqComp(${it.id_produto})"> cx
          <div class="muted" style="font-size:11px" id="eqc${it.id_produto}">${equiv(it,s.pedido_final??s.sug_operador??s.sug_sistema)}</div></td>
    </tr>`;
  }
  h+=`</table></div>`;
  $("#fbar").classList.remove("hide");
  $("#fbar").innerHTML=`
    <button onclick="salvarComprador()" style="background:${corLoja(lojaSel)};color:#fff">💾 Salvar ${esc(nomeLoja(lojaSel))}</button>
    <button class="bt-p" onclick="exportarTXT()">📄 Exportar TXT</button>`;
  return h;
}
function trocaLoja(l){ if(l!==lojaSel){lojaSel=l; lojaTrocadaEm=Date.now();} render(); }
function alertaTroca(loja){
  return (Date.now()-lojaTrocadaEm<15000)
    ? `<div class="alerta-vermelho">⚠️ Você trocou para a ${esc(nomeLoja(loja))} há poucos segundos. Confira se é mesmo esta loja.</div>` : "";
}
/* trava 4: quem lançou nesta loja hoje + desfazer por usuário */
function blocoLancadores(loja){
  const por={};
  for(const s of cache.sug.filter(x=>x.loja===loja&&x.operador_login)){
    const k=s.operador_login; por[k]=por[k]||{n:0,ult:null};
    por[k].n++; if(!por[k].ult||s.operador_em>por[k].ult) por[k].ult=s.operador_em;
  }
  const ks=Object.keys(por); if(!ks.length) return "";
  return ks.map(k=>{const u=(cache.users||{})[k]||{nome:"usuário "+k};
    const outra = u.loja && u.loja!==loja && LOJA_INFO[u.loja];
    return `<div class="lanc ${outra?"neg":""}">${outra?"⚠️ ":"👤 "}<b>${esc(u.nome)}</b>${u.loja?` (${esc(nomeLoja(u.loja))})`:""}
      lançou ${por[k].n} itens às ${hhmm(por[k].ult)}${outra?" — <b>usuário de OUTRA loja!</b>":""}
      <button class="bt-g" onclick="apagarLancamentos('${loja}','${k}')">🗑️ Apagar</button></div>`;}).join("");
}
async function apagarLancamentos(loja,uid){
  const u=(cache.users||{})[uid]||{nome:"este usuário"};
  if(!await confirmar({loja, titulo:"Apagar as sugestões de hoje lançadas por", grande:esc(u.nome),
    corpo:`<p>Na loja <b>${esc(nomeLojaLongo(loja))}</b>. A sugestão do sistema e o pedido do comprador continuam; some só o que esse usuário digitou hoje.</p>`,
    ok:"Apagar"})) return;
  const {error}=await sb.from("aves_sugestoes").update({sug_operador:null,justificativa_operador:null,operador_login:null,operador_em:null})
    .eq("data",cache.hoje).eq("loja",loja).eq("operador_login",uid);
  if(error) return alert("Erro: "+error.message);
  alert("✅ Lançamentos apagados."); await carregar(); render();
}
function eqComp(pid){
  const el=$("#eqc"+pid); if(el) el.textContent=equiv(cache.porId[pid], $("#pd"+pid).value);
}
async function salvarComprador(){
  const ups=[];
  for(const it of cache.itens){
    const el=$("#pd"+it.id_produto); if(!el||el.value==="") continue;
    ups.push({data:cache.hoje,loja:lojaSel,id_produto:it.id_produto,pedido_final:Number(el.value),
      comprador_login:sess.id,comprador_em:new Date().toISOString()});
  }
  if(!ups.length) return alert("Nenhum pedido digitado.");
  const fora=[]; for(const u of ups){const it=cache.porId[u.id_produto]; const r=foraDoNormal(lojaSel,it,u.pedido_final);
    if(r) fora.push({nome:it.descricao,val:u.pedido_final,ref:r});}
  const i=LOJA_INFO[lojaSel]||{nome:lojaSel,bairro:""};
  if(!await confirmar({loja:lojaSel, titulo:`Salvar pedido de ${ups.length} itens da loja`, grande:`${lojaSel} · ${esc(i.nome)}`,
     corpo:`<p style="text-align:center;margin:0 0 6px">📍 ${esc(i.bairro)}</p>${alertaTroca(lojaSel)}${listaFora(fora)}`,
     ok:"Salvar pedido", exigeCheck: fora.length?"Conferi os itens acima":null})) return;
  const {error}=await sb.from("aves_sugestoes").upsert(ups,{onConflict:"data,loja,id_produto"});
  if(error) return alert("Erro: "+error.message);
  alert(`✅ Pedido de ${lojaSel} salvo (${ups.length} itens).`);
  await carregar(); render();
}
/* TXT no LAYOUT PEDIDO do VR (separador "|"):
   CODIGO INTERNO | QUANTIDADE | EMBALAGEM | PRECO
   Um arquivo por LOJA x FORNECEDOR — a loja e o fornecedor são escolhidos
   na tela do VR ao importar, por isso não vão dentro do arquivo. */
async function exportarTXT(){
  await carregar();                       // pega o que está salvo de todas as lojas
  const hoje=cache.hoje;
  let ger=0, itens=0;
  for(const forn of ["natto","mauricea"]){
    for(const loja of Object.keys(LOJAS)){
      const linhas=[];
      for(const it of cache.itens.filter(i=>i.fornecedor===forn)){
        const s=sugDe(loja,it.id_produto);
        const q=s?(s.pedido_final??null):null;
        if(!q) continue;                              // só o que o comprador fechou
        // decimal com VÍRGULA e sempre 2 casas (padrão do VR)
        const emb=Number(porCaixa(it)).toFixed(2).replace(".",",");
        const custo=Number(it.ultimo_custo||0).toFixed(2).replace(".",",");
        linhas.push(`${it.id_produto}|${Number(q)}|${emb}|${custo}`);
        itens++;
      }
      if(!linhas.length) continue;
      const blob=new Blob([linhas.join("\r\n")+"\r\n"],{type:"text/plain;charset=utf-8"});
      const aEl=document.createElement("a");
      aEl.href=URL.createObjectURL(blob);
      aEl.download=`pedido_${loja}_${forn}_${hoje}.txt`;
      aEl.click();
      ger++;
    }
  }
  if(!ger) return alert("Nenhum pedido salvo para exportar. Digite as caixas e clique em Salvar antes.");
  alert(`✅ ${ger} arquivo(s) gerado(s), ${itens} itens.\n\nUm arquivo por LOJA x FORNECEDOR, no LAYOUT PEDIDO do VR (código|qtd|embalagem|preço).\nNo VR: Pedido de Compra → Incluir (escolher fornecedor e loja) → Gerar → Importar → Arquivo.`);
}

/* ================= FLUXO ================= */
function render(){
  $("#fbar").classList.add("hide");
  $("#app").innerHTML = PAPEIS_COMPRADOR.includes(sess.papel)?vComprador():vOperador();
}
async function iniciar(){
  $("#hUser").textContent=sess.nome.split(" ")[0];
  $("#app").innerHTML=`<p class="center muted">Carregando…</p>`;
  if(!await confirmaLojaDoDia()) return;
  try{ await carregar(); render(); }
  catch(e){ $("#app").innerHTML=`<div class="alert">Erro ao carregar: ${esc(e.message||e)}</div>`; }
}
(async()=>{
  const s=localStorage.getItem("aves_sess");
  if(s){
    const {id}=JSON.parse(s);
    const {data}=await sb.from("usuarios").select("*").eq("id",id).single();
    if(data&&data.ativo){ sess=data; return iniciar(); }
  }
  telaLogin();
})();
</script>
